apiVersion: apps/v1
kind: Deployment
metadata:
  name: clothing-classifier
  labels:
    app: clothing-classifier
spec:
  replicas: 2 # 2 pods
  selector:
    matchLabels:
      app: clothing-classifier
  template:
    metadata:
      labels:
        app: clothing-classifier
    spec:
      containers:
      - name: clothing-classifier
        image: clothing-classifier:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi" # ~ 268 Mb
            cpu: "250m" # 0.25 CPU Core
          limits:
            memory: "512Mi" 
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health # required to avoid restarting
            port: 8080
          initialDelaySeconds: 10 # second to curl health after a pod start
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5